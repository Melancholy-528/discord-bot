services:
  - type: web
    name: discord-bot
    runtime: python
    plan: free
    buildCommand: pip install -r req.txt && curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh
    startCommand: export PATH="$HOME/.deno/bin:$PATH"; python main.py
    healthCheckPath: /ping
    envVars:
      - key: DISCORD_TOKEN
        sync: false
